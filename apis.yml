apis:
  - name: Thordata SERP API
    description: >-
      Real-time search engine results as parsed JSON or raw HTML across Google, Bing, Yandex and
      DuckDuckGo, with per-country and per-language targeting, vertical selection (images, news,
      shopping, video), time filters and optional JavaScript rendering. A single POST /request
      endpoint authenticated with a bearer scraper token, also reachable through a proxy gateway on
      scraping.thordata.com:30001. Google support extends to search, shopping, local, videos, news,
      product, flights, images, lens, trends, hotels, play, jobs, scholar, maps, finance and
      patents. Billed only on a 200 response.
    humanURL: https://doc.thordata.com/doc/scraping/serp-api/introduction
    baseURL: https://scraperapi.thordata.com
    tags:
      - SERP
      - Search data
      - Web scraping
      - Data extraction
      - Data-for-AI
    properties:
      - type: OpenAPI
        url: openapi/thordata-scraper-api-openapi.yml
      - type: Documentation
        url: https://doc.thordata.com/doc/scraping/serp-api/introduction
      - type: APIReference
        url: https://doc.thordata.com/doc/scraping/serp-api/query-parameters
      - type: GettingStarted
        url: https://doc.thordata.com/doc/scraping/serp-api/quick-start-guide
      - type: Overlay
        url: overlays/thordata-scraper-api-overlay.yaml
      - type: Pricing
        url: https://www.thordata.com/pricing/serpapi
      - type: Sandbox
        url: https://dashboard.thordata.com/serp-api/playground
      - type: AgentSkill
        url: skills/thordata-serp-search.md
  - name: Thordata Universal Scraping API & Web Unlocker
    description: >-
      Single-endpoint collection of any URL through Thordata's unblocking layer, with optional
      JavaScript rendering for SPAs, proxy country targeting, resource blocking to cut collection
      time, JS/CSS stripping, fixed or selector-based waits, and custom headers and cookies. Returns
      rendered HTML or a PNG screenshot. universalapi.thordata.com and webunlocker.thordata.com are
      documented aliases for the same contract. Billed only on a 200.
    humanURL: https://doc.thordata.com/doc/scraping/universal-scraping-api/introduction
    baseURL: https://universalapi.thordata.com
    tags:
      - Web scraping
      - Web unblocking
      - Data extraction
      - Data-for-AI
      - RAG data pipelines
    properties:
      - type: OpenAPI
        url: openapi/thordata-universal-api-openapi.yml
      - type: Documentation
        url: https://doc.thordata.com/doc/scraping/universal-scraping-api/introduction
      - type: APIReference
        url: https://doc.thordata.com/doc/scraping/web-unlocker/query-parameters
      - type: GettingStarted
        url: https://doc.thordata.com/doc/scraping/universal-scraping-api/quick-start-guide
      - type: Overlay
        url: overlays/thordata-universal-api-overlay.yaml
      - type: Pricing
        url: https://www.thordata.com/pricing/web-unlocker
      - type: AgentSkill
        url: skills/thordata-scrape-page.md
  - name: Thordata Web Scraper API
    description: >-
      Pre-built site extractors run as asynchronous tasks - launch with POST /builder or
      /video_builder on scraperapi.thordata.com, then list, poll and download results from the
      web-scraper-api host. Twenty published parameter references cover Amazon, LinkedIn, TikTok,
      Instagram, Facebook, Twitter, Reddit, YouTube, Zillow, Airbnb, Booking, Walmart, eBay, Yelp,
      Indeed, Glassdoor, Crunchbase, GitHub, Google and Google Play. Results download as JSON, CSV,
      video, audio or subtitles. Supports cron scheduling and outbound webhooks on task start,
      success and failure, plus S3, Gmail and Snowflake delivery.
    humanURL: https://doc.thordata.com/doc/scraping/web-scraper-api/getting-started-guide
    baseURL: https://openapi.thordata.com/api/web-scraper-api
    tags:
