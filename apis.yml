  - name: Thordata Public API
    description: >-
      Account and proxy management. Reads wallet balance in USD, traffic balance in KB and daily
      usage statistics over ranges of up to 180 days; lists purchased ISP and datacenter proxies with
      their credentials and expiry; creates, updates, meters and deletes proxy sub-users with
      per-user traffic caps in MB; and manages IP whitelisting for password-free proxy access.
      Authenticated with a publicToken and publicKey pair sent as the token and key headers, and
      returns a distinct five-digit error-code space.
    humanURL: https://doc.thordata.com/doc/proxies/residential-proxies/getting-started
    baseURL: https://openapi.thordata.com/api
    tags:
      - Proxy network
      - Residential proxies
      - ISP proxies
      - Datacenter proxies
      - Mobile proxies
    properties:
      - type: OpenAPI
        url: openapi/thordata-public-api-openapi.yml
      - type: Documentation
        url: https://doc.thordata.com/doc/proxies/residential-proxies/getting-started
      - type: Overlay
        url: overlays/thordata-public-api-overlay.yaml
      - type: ToolCrosswalk
        url: mcp/thordata-tool-crosswalk.yml
      - type: AgentSkill
        url: skills/thordata-manage-proxy-users.md
  - name: Thordata Locations API
    description: >-
      Geo-targeting reference data - the countries, states, cities and ASNs available for each proxy
      product. Read this before setting a country, state or city on any collection call or in a
      proxy username, because availability differs per product.
    humanURL: https://doc.thordata.com/doc/proxies/residential-proxies/location-settings
    baseURL: https://openapi.thordata.com/api/locations
    tags:
      - Proxy network
      - Residential proxies
      - Mobile proxies
    properties:
      - type: OpenAPI
        url: openapi/thordata-locations-api-openapi.yml
      - type: Documentation
        url: https://doc.thordata.com/doc/proxies/residential-proxies/location-settings
      - type: Overlay
        url: overlays/thordata-locations-api-overlay.yaml
  - name: Thordata Proxy IP Extract API
    description: >-
      Pull a batch of proxy endpoints as host:port pairs for the residential or unlimited product,
      filtered by country, state, city, protocol and session time, returned as plain text or JSON.
      Used to hand a pool of endpoints to a client that rotates them itself rather than relying on
      the gateway.
    humanURL: https://doc.thordata.com/doc/proxies/residential-proxies/making-request
    baseURL: https://get-ip.thordata.net
    tags:
