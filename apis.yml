- name: Thordata Proxy IP Extract API
  description: >-
    Pull a batch of proxy endpoints as host:port pairs for the residential or unlimited product, filtered
    by country, state, city, protocol and session time, returned as plain text or JSON. Used to hand a
    pool of endpoints to a client that rotates them itself rather than relying on the gateway.
  humanURL: https://doc.thordata.com/doc/proxies/residential-proxies/making-request
  baseURL: https://get-ip.thordata.net
