    Geo-targeting reference data - the countries, states, cities and ASNs available for each proxy product.
    Read this before setting a country, state or city on any collection call or in a proxy username, because
    availability differs per product.
  humanURL: https://doc.thordata.com/doc/proxies/residential-proxies/location-settings
