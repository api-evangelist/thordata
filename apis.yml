x-not-published:
  note: >-
    Recorded so a reader can tell absence from an unchecked field. Each of these was probed on
    2026-08-11 and confirmed missing; no pointer is emitted for any of them.
  status_page: >-
    None. status.thordata.com does not resolve and no status or uptime link appears in the docs,
    either llms.txt, or the sitemap.
  well_known: >-
    Every /.well-known/ path returns 404 on every host, including security.txt, despite a live paid
    vulnerability reward program. See well-known/thordata-well-known.yml.
  agent_card: >-
    /.well-known/agent-card.json and /.well-known/agent.json both 404 on all four hosts. No a2a/
    artifact is written, because an agent card can only ever be something the provider serves.
  mcp_server: >-
    No MCP server exists - mcp.thordata.com does not resolve, /mcp 404s, and there is no MCP package
    or repository in the Thordata organization. mcp/thordata-mcp.yml records a CANDIDATE tool list
    derived from real operations and deliberately carries no MCPServer pointer, so the catalog does
    not credit Thordata with a server it has not built. Its real agent surface is the official
    LangChain tool pack, crosswalked in mcp/thordata-tool-crosswalk.yml.
  compliance: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP certification is claimed anywhere, and no trust
    center exists. The published KYC program is customer vetting, not a third-party audit.
  deprecation_policy: >-
    None. No Sunset or Deprecation headers and no policy page; deprecations surface only in SDK
    changelogs after the fact.
  oauth: No OAuth 2.0 or OpenID Connect surface, so no scopes/ artifact.
  asyncapi: >-
    No AsyncAPI document. The webhook surface is real and documented, so a Webhooks pointer is
    emitted, but no AsyncAPI pointer.
  cli: No first-party CLI.
  postman: No official public Postman workspace or collection.
