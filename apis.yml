name: Thordata
description: >-
  Web data collection infrastructure combining a global proxy network with four HTTP collection APIs.
  The proxy side spans residential, ISP, datacenter, mobile and high-bandwidth pools reached through
  a gateway with per-product ports, geo-targeting encoded in the username, and either Basic auth or
  IP whitelisting. The API side is a SERP API across Google, Bing, Yandex and DuckDuckGo; a Universal
  Scraping API and Web Unlocker for JavaScript-rendered and blocked pages; a Web Scraper API of
  pre-built extractors for Amazon, LinkedIn, TikTok, Zillow, Crunchbase and sixteen more sites, run
  as asynchronous tasks with cron scheduling and webhook callbacks; and a remote Scraping Browser
  driven over the Chrome DevTools Protocol from Puppeteer, Playwright or Selenium. A public
  management API covers account balances, proxy inventory, proxy sub-user provisioning with traffic
  caps, IP whitelisting and geo-targeting reference data. Thordata maintains a canonical
  cross-language SDK specification on GitHub that drives official Python, JavaScript, Go and Java
  clients, publishes an OpenAPI generated from it, ships an official LangChain tool pack and a
  Firecrawl-compatible layer, and serves a full markdown documentation index at llms.txt. Billing is
  prepaid and unusual in one respect that matters to automated consumers: only a 200 response is
  charged, so failed and empty collections cost nothing.
