  - {name: Go SDK, url: 'https://github.com/Thordata/thordata-go-sdk/blob/main/CHANGELOG.md'}
  - {name: Java SDK, url: 'https://github.com/Thordata/thordata-java-sdk/blob/main/CHANGELOG.md'}
