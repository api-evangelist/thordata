api_changelog: null
note: >-
  Thordata publishes no API changelog. There is no release-notes page, no dated "what's new"
  section in the docs and no entry for one in either llms.txt. The only dated record of change on
  the whole platform is the SDK changelogs, and they mix client-library refactors with real
  API-surface additions - so an integrator has to read a Python library's changelog to learn that
  the SERP API gained nine engine variants. The entries below are the API-affecting ones extracted
  from the Python SDK changelog; SDK-internal changes are excluded.
scheme: semver (per SDK, not per API)
