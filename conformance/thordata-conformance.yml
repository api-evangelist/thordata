  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR certification is claimed anywhere on
    thordata.com. No trust center exists (trust.thordata.com and security.thordata.com do not
    resolve). No Compliance or TrustCenter pointer is emitted in apis.yml, because there is no
    published certification to point at.
  what_is_published:
