gaps:
- No status page - the single highest-value operational artifact missing from this provider.
- No API-level changelog or release notes; SDK changelogs are the substitute.
- No deprecation policy, no Sunset/Deprecation headers, no advance notice channel.
- No published SLA or uptime target.
- Published OpenAPI names a server host (api.thordata.com) that 404s, and covers 4 of ~27 operations.
spec_reality_drift:
- finding: Thordata's own published OpenAPI declares https://api.thordata.com/api as a "Proxy API" server, but that
    host returns "404 page not found" on /api and on /openapi.json. No documented operation uses it. The real proxy
    management host is https://openapi.thordata.com/api.
