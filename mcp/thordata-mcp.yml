agentic_notes:
  - >-
    Collection tools (serp_search, scrape_url, run_scraper_task) are billed on success and have no
    idempotency contract, so an MCP server fronting them should treat every call as a new charge.
  - >-
    Proxy user and whitelist operations are account-mutating and should carry a higher consequence
    class than the read and collection tools.
