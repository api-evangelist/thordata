note: >-
  Thordata publishes no MCP server, so the agent-tool surface crosswalked here is the OFFICIAL
  LangChain tool pack - seven tools in the Thordata GitHub organization. Each is bound below to the
  OpenAPI operation that backs it, so the tool inherits a real input contract from the spec rather
  than a guessed one. Tool names and input fields were read from the published Python source; the
  bindings are semantic (the package calls the REST endpoints internally) and confidence is marked
  accordingly.
