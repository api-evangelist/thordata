currency_findings:
  - >-
    Four of the seven first-party packages have no installable release: Java was never published to
    Maven Central, the LangChain tools were never published to PyPI, and the n8n node was published
    and then unpublished.
  - >-
    The three that are installable are stale relative to their own repositories. Python is the only
    SDK whose latest release (1.8.5, 2026-02-27) matches its last repository push.
  - >-
    Roughly five and a half months elapsed between the newest Thordata release on any registry
    (thordata-firecrawl 0.2.0, 2026-03-06) and this check on 2026-08-11.
spec_repo:
  name: Thordata/thordata-sdk-spec
  url: https://github.com/Thordata/thordata-sdk-spec
  role: >-
    Canonical cross-SDK specification. Defines base URLs, endpoint paths, auth modes, proxy gateway
    conventions, SERP parameter normalization, error-code precedence and webhook payloads. Consumed
    by SDK parity tests; every SDK repo pins it as a submodule.
  artifacts:
    - v1.json (canonical, generated from spec/v1/*.yaml)
    - schema/v1.schema.json
    - mock-server/ (Go mock server, see sandbox/thordata-sandbox.yml)
    - docs/index.html + openapi.json published to GitHub Pages
